<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>foundry-lab</title>
<style>
  :root{--bg:#14161c;--bg2:#1a1d25;--bg3:#20242e;--line:#2c313d;--fg:#e6e9ef;
        --dim:#8b93a5;--dim2:#646c7e;--accent:#4b8dff;--lead:#e0a53f;--red:#e05f5f;
        --green:#3fbf7f;--seat:#7c6cf0}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);overflow:hidden;
    font:13px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif}
  .app{display:grid;grid-template-columns:262px 1fr;grid-template-rows:minmax(0,1fr) auto;
    height:100vh;min-height:0}
  /* Without min-height:0 a grid/flex child grows past its track instead of
     scrolling, which pushes the composer off screen. */
  .side,.main{min-height:0;overflow:hidden}
  .grow{flex:1}

  .side{background:var(--bg2);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .brand{display:flex;align-items:center;gap:8px;padding:12px 14px 4px}
  .brand .logo{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;
    background:linear-gradient(150deg,var(--accent),var(--seat));font-weight:700;font-size:11px;color:#fff}
  .brand b{font-size:12.5px}
  .hd{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim2);
    padding:14px 14px 8px;display:flex;justify-content:space-between}
  .scroll{overflow-y:auto;flex:1}
  .node{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;
    color:var(--fg);margin:0 6px;cursor:pointer}
  .node .t{flex:1;font-weight:600}
  .caret{width:9px;font-size:9px;color:var(--dim2);transform:rotate(90deg);display:inline-block}
  .toggle{border:1px solid var(--line);border-radius:6px;color:var(--dim2);font-size:10px;
    padding:0 6px;line-height:16px}
  .sessions{margin:1px 0 6px 21px;border-left:1px solid var(--line);padding-left:7px}
  .sess{display:flex;align-items:center;gap:7px;padding:5px 8px;border-radius:6px;color:var(--fg);
    background:rgba(75,141,255,.13);box-shadow:inset 2px 0 0 var(--accent)}
  .sess .t{flex:1}
  .sub{margin:2px 0 8px 15px;border-left:1px solid var(--line);padding-left:7px}
  .room{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:6px;
    color:var(--dim);cursor:pointer}
  .room:hover{background:var(--bg3);color:var(--fg)}
  .room.on{background:var(--bg3);color:var(--fg)}
  .room .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .avs{display:flex}
  .avs i{width:14px;height:14px;border-radius:4px;margin-left:-4px;border:1.5px solid var(--bg2);font-style:normal}
  .spin{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--accent);
    border-top-color:transparent;animation:sp .8s linear infinite;flex:none}
  @keyframes sp{to{transform:rotate(360deg)}}

  .main{display:flex;flex-direction:column;min-width:0}
  .top{border-bottom:1px solid var(--line);padding:9px 18px;display:flex;align-items:center;gap:9px}
  .top h1{font-size:14.5px;margin:0;font-weight:600}
  .chip{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
    padding:2px 9px;cursor:pointer;background:none;font-family:inherit;white-space:nowrap}
  .chip:hover{color:var(--fg);border-color:var(--dim2)}
  .chip.turn{border-color:rgba(75,141,255,.4);color:var(--accent)}
  .strip{border-bottom:1px solid var(--line);padding:7px 18px;display:flex;align-items:center;
    gap:7px;background:var(--bg2);flex-wrap:wrap}
  .pers{display:flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;
    padding:1px 9px 1px 3px;color:var(--dim);cursor:pointer}
  .pers:hover{color:var(--fg)}
  .pers .sw{width:16px;height:16px;border-radius:5px;display:grid;place-items:center;
    font-size:8.5px;font-weight:700;color:#fff}
  .pers.is-lead{border-color:rgba(224,165,63,.5);color:var(--fg)}
  .pers.busy{border-color:rgba(75,141,255,.55);color:var(--fg)}
  .star{color:var(--lead);font-size:11px}
  .act{font-size:10px;color:var(--accent)}

  .thread{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;padding:18px 22px}
  .composer{flex:none}
  /* macOS hides overlay scrollbars until you scroll; make them permanent so
     there is always a visual cue that there is more above. */
  .thread::-webkit-scrollbar,.scroll::-webkit-scrollbar{width:10px}
  .thread::-webkit-scrollbar-thumb,.scroll::-webkit-scrollbar-thumb{
    background:#333a48;border-radius:6px;border:3px solid transparent;background-clip:content-box}
  .thread::-webkit-scrollbar-thumb:hover,.scroll::-webkit-scrollbar-thumb:hover{background:#454d5e}
  .thread::-webkit-scrollbar-track,.scroll::-webkit-scrollbar-track{background:transparent}
  .msg{display:grid;grid-template-columns:32px 1fr;gap:11px;margin-bottom:15px}
  .av{width:32px;height:32px;border-radius:8px;display:grid;place-items:center;
    font-size:11px;font-weight:700;color:#fff}
  .who{display:flex;align-items:baseline;gap:8px;margin-bottom:2px;flex-wrap:wrap}
  .who b{font-size:13px}
  .who .tag{font-size:10px;color:var(--dim2);border:1px solid var(--line);border-radius:4px;padding:0 5px}
  .who .time{font-size:10px;color:var(--dim2)}
  .who .lb{font-size:9.5px;color:var(--lead);border:1px solid rgba(224,165,63,.4);
    border-radius:4px;padding:0 5px}
  .bd{color:#cfd5e0;white-space:pre-wrap;word-wrap:break-word}
  .bd code{background:var(--bg3);padding:1px 5px;border-radius:4px;font-size:12px;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .bd pre{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;
    overflow-x:auto;font-size:12px;white-space:pre;margin:6px 0;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
  .mention{color:var(--accent);background:rgba(75,141,255,.12);border-radius:4px;padding:0 3px}
  /* A centred grey line with nothing beside it reads as a hole in the
     transcript. Give it a rule so it reads as a deliberate separator. */
  .sys{font-size:10.5px;color:var(--dim2);text-align:center;margin:10px 0;position:relative}
  .sys::before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
  .sys span{position:relative;background:var(--bg);padding:0 10px}
  .err{color:var(--red);font-size:12px;text-align:center;margin:6px 0 14px;
    border:1px solid rgba(224,95,95,.3);background:rgba(224,95,95,.07);border-radius:8px;padding:8px 12px}
  .empty{color:var(--dim2);text-align:center;margin-top:70px;line-height:1.9}

  .composer{border-top:1px solid var(--line);padding:11px 16px;flex:none}
  .cbox{background:var(--bg2);border:1px solid var(--line);border-radius:8px;padding:9px 11px}
  .cbox:focus-within{border-color:rgba(75,141,255,.5)}
  textarea{width:100%;background:none;border:0;color:var(--fg);resize:none;font:inherit;
    outline:none;height:38px;max-height:180px}
  .ctools{display:flex;align-items:center;gap:8px;margin-top:3px}
  .send{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:5px 14px;
    font:inherit;cursor:pointer}
  .send:disabled{opacity:.4;cursor:default}

  .statusbar{grid-column:1/-1;border-top:1px solid var(--line);background:#101319;
    padding:5px 14px;display:flex;align-items:center;gap:14px;font-size:11px;color:var(--dim2)}
  .statusbar b{color:var(--dim);font-weight:600}
  .statusbar .sep{color:var(--line)}
  .statusbar .warn{color:var(--lead)}
  .toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:var(--bg3);
    border:1px solid var(--line);border-radius:8px;padding:8px 14px;font-size:12px;z-index:60}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo">F</span><b>foundry-lab</b></div>
    <div class="hd">Projects</div>
    <div class="scroll">
      <div class="node"><span class="caret">▶</span><span class="t">foundry-lab</span>
        <span class="toggle">+</span></div>
      <div class="sessions">
        <div class="sess"><span class="t">main</span><span class="toggle" id="roomcount">−</span></div>
        <div class="sub" id="rooms"></div>
      </div>
    </div>
  </aside>

  <section class="main">
    <header class="top">
      <h1 id="rname"># team</h1>
      <div class="grow"></div>
      <button class="chip turn" id="polbtn">broadcast</button>
      <button class="chip" id="clearbtn">Clear context…</button>
    </header>
    <div class="strip" id="strip"></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <div class="cbox">
        <textarea id="input" placeholder="Message the room…   @Claude or @Codex to address one"></textarea>
        <div class="ctools"><div class="grow"></div><button class="send" id="sendbtn">Send</button></div>
      </div>
    </div>
  </section>

  <div class="statusbar" id="statusbar"></div>
</div>

<script>
let S = null, ROOM = 'team', POLL = null;
const POLICIES = ['broadcast','mention','round_robin','lead'];
const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s)
  .replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>')
  .replace(/`([^`\n]+)`/g,'<code>$1</code>')
  .replace(/@(Claude|Codex|Marian)\b/g,'<span class="mention">@$1</span>');
const hhmm = ts => { const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };
const room = () => S.rooms.find(r=>r.key===ROOM);
const agentStatus = name => (S.status.agents||[])
  .filter(a=>a.member===name && (a.scope===ROOM || a.scope==='*'))[0] || {};

function renderRooms(){
  const box=document.getElementById('rooms'); box.innerHTML='';
  S.rooms.forEach(r=>{
    const el=document.createElement('div');
    el.className='room'+(r.key===ROOM?' on':'');
    el.innerHTML=`<span class="t">${r.key==='team'?'# team':'↳ '+r.name}</span>`
      +(r.busy?'<span class="spin"></span>':'')
      +`<span class="avs">${r.members.map(m=>
          `<i style="background:${S.members[m].color}"></i>`).join('')}</span>`;
    el.onclick=()=>{ROOM=r.key; render();};
    box.appendChild(el);
  });
  document.getElementById('roomcount').textContent='− '+S.rooms.length;
}

function renderStrip(){
  const r=room(), st=document.getElementById('strip'); st.innerHTML='';
  r.members.forEach(m=>{
    const mem=S.members[m], a=agentStatus(mem.name);
    const busy=!!a.activity;
    const el=document.createElement('span');
    el.className='pers'+(m==='you'?' is-lead':'')+(busy?' busy':'');
    el.title = mem.kind==='human' ? 'you — lead of every room'
      : `${a.provider||mem.model} · ${a.model||''}\nconversation ${a.conversation||'—'}\n`
        +`${a.turns||0} turns · ${a.tokens||0} tokens`;
    el.innerHTML=`<span class="sw" style="background:${mem.color}">${mem.initial}</span>${mem.name}`
      +(m==='you'?' <span class="star">★</span>':'')
      +(busy?` <span class="act">${a.activity}…</span>`:'');
    st.appendChild(el);
  });
}

function renderThread(){
  const r=room(), th=document.getElementById('thread');
  const at=th.scrollTop+th.clientHeight>=th.scrollHeight-40;
  if(!r.messages.length){
    th.innerHTML='<div class="empty">Empty room.<br>'
      +'Turn-taking is <b>'+r.policy+'</b>. Write something.</div>';
    return;
  }
  th.innerHTML=r.messages.map(m=>{
    if(m.author==='system')
      return m.kind==='error'
        ? `<div class="err">${esc(m.text)}</div>`
        : `<div class="sys"><span>${esc(m.text)}</span></div>`;
    const a=S.members[m.author]||{name:m.author,initial:'?',color:'#3b404d',model:''};
    const meta=m.meta||{};
    const tags=`<span class="tag">${esc(a.model)}</span>`
      +(meta.elapsed!==undefined?`<span class="tag">${meta.elapsed}s</span>`:'')
      +(meta.tokens?`<span class="tag">${meta.tokens} tok</span>`:'')
      +(m.author==='you'?'<span class="lb">★ lead</span>':'');
    return `<div class="msg"><div class="av" style="background:${a.color}">${a.initial}</div><div>
      <div class="who"><b>${esc(a.name)}</b>${tags}<span class="time">${hhmm(m.ts)}</span></div>
      <div class="bd">${fmt(m.text)}</div></div></div>`;
  }).join('');
  if(at) th.scrollTop=th.scrollHeight;
}

function renderStatus(){
  const s=S.status, bar=document.getElementById('statusbar');
  const procs=new Set();
  (s.agents||[]).forEach(a=>(a.pids||[]).forEach(p=>procs.add(p)));
  (s.shared||[]).forEach(x=>procs.add(x.pid));
  const turns=(s.agents||[]).reduce((n,a)=>n+(a.turns||0),0);
  const toks=(s.agents||[]).reduce((n,a)=>n+(a.tokens||0),0);
  const backend = s.backend==='app' ? 'codex app-server (experimental)' : 'codex mcp-server';
  bar.innerHTML =
     `<b>${backend}</b><span class="sep">|</span>`
    +`conversations per (member × ${s.scope})<span class="sep">|</span>`
    +`<b>${s.agents.length}</b> conversations<span class="sep">·</span>`
    +`<b>${procs.size}</b> processes<span class="sep">·</span>`
    +`<b>${s.total_rss_mb}</b> MB<span class="sep">·</span>`
    +`<b>${turns}</b> turns<span class="sep">·</span><b>${toks.toLocaleString()}</b> tokens`
    + (s.agents.some(a=>a.alive===false)
       ? '<span class="sep">|</span><span class="warn">a process is down</span>' : '');
}

function render(){
  const r=room();
  document.getElementById('rname').textContent = r.key==='team'?'# team':'↳ '+r.name;
  document.getElementById('polbtn').textContent = r.policy;
  document.getElementById('sendbtn').disabled = r.busy;
  renderRooms(); renderStrip(); renderThread(); renderStatus();
}

async function refresh(){
  const res=await fetch('/api/state'); S=await res.json(); render();
  const busy=S.rooms.some(r=>r.busy);
  clearTimeout(POLL); POLL=setTimeout(refresh, busy?700:2500);
}

async function post(path, body){
  const r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify(body||{})});
  return r.json();
}

async function send(){
  const inp=document.getElementById('input'), text=inp.value.trim();
  if(!text) return;
  inp.value=''; inp.style.height='38px';
  document.getElementById('sendbtn').disabled=true;
  const d=await post('/api/send',{room:ROOM,text});
  if(d.error) toast(d.error);
  refresh();
}

document.getElementById('sendbtn').onclick=send;
document.getElementById('input').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send();}});
document.getElementById('input').addEventListener('input',e=>{
  e.target.style.height='38px'; e.target.style.height=Math.min(180,e.target.scrollHeight)+'px';});
document.getElementById('polbtn').onclick=async()=>{
  const r=room(), next=POLICIES[(POLICIES.indexOf(r.policy)+1)%POLICIES.length];
  await post('/api/policy',{room:ROOM,policy:next}); refresh(); };
document.getElementById('clearbtn').onclick=async()=>{
  const r=room();
  const agents=r.members.filter(m=>S.members[m].kind==='agent');
  const who=prompt('Clear whose context? '+agents.map(m=>S.members[m].name).join(' / '),
                   S.members[agents[0]].name);
  if(!who) return;
  const key=Object.keys(S.members).find(k=>S.members[k].name.toLowerCase()===who.toLowerCase());
  if(!key) return toast('no such member');
  await post('/api/reset',{room:ROOM,member:key});
  toast(who+"'s context cleared — the room kept its history"); refresh(); };

let TT; function toast(t){ clearTimeout(TT);
  document.querySelectorAll('.toast').forEach(x=>x.remove());
  const d=document.createElement('div'); d.className='toast'; d.textContent=t;
  document.body.appendChild(d); TT=setTimeout(()=>d.remove(),3000); }

refresh().then(()=>document.getElementById('input').focus());
</script>
</body>
</html>
