<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kenbet</title>
<link rel="stylesheet" href="/kenbet.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand"><span class="logo">K</span><b>kenbet</b></div>
    <div class="hd">Projects <u title="New project">+</u></div>
    <div class="scroll">
      <div class="node"><span class="t">kenbet</span><span class="toggle" title="New session">+</span></div>
      <div class="sessions" id="tree"></div>
    </div>
    <nav class="nav">
      <div class="nb on"><i>▤</i>Projects</div>
      <div class="nb" id="nav-members"><i>◉</i>Members</div>
      <div class="nb" id="nav-runs"><i>⚡</i>Runs</div>
      <div class="nb" id="nav-settings"><i>⚙</i>Settings</div>
    </nav>
  </aside>

  <section class="main">
    <header class="top">
      <div class="title" id="title"></div>
      <div class="grow"></div>
    </header>
    <div class="strip" id="strip"></div>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <div class="cbox">
        <textarea id="input" placeholder="Message the room…   @Claude or @Codex to address one"></textarea>
        <div class="ctools"><div class="grow"></div><button class="send" id="sendbtn">Send</button></div>
      </div>
    </div>
  </section>

  <div class="statusbar" id="statusbar"></div>
</div>

<script>
/* ------------------------------------------------------------------ state */
let S = null;              /* last /api/state payload */
let ROOM = 'main';         /* selected room key */
let OPEN = false;          /* is the session expanded in the sidebar */
let POLL = null;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s)
  .replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>')
  .replace(/`([^`\n]+)`/g,'<code>$1</code>')
  .replace(/@(Claude|Codex|Marian)\b/g,'<span class="mention">@$1</span>');
const hhmm = ts => { const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

const room    = () => S.rooms.find(r => r.key === ROOM) || S.rooms[0];
const mainRm  = () => S.rooms.find(r => r.key === 'main');
const subs    = () => S.rooms.filter(r => r.key !== 'main');
const seatById= id => S.seats.find(s => s.id === id);
const memberOf= seat => seat.occupant ? S.members[seat.occupant] : null;
const liveOf  = name => (S.status.agents || [])
  .filter(a => a.member === name && (a.scope === ROOM || a.scope === '*'))[0] || {};

/* ------------------------------------------------------------------ sidebar */
function renderTree(){
  const box = document.getElementById('tree'); box.innerHTML = '';
  const m = mainRm();

  const row = document.createElement('div');
  row.className = 'sess' + (ROOM === 'main' ? ' on' : '');
  row.innerHTML = `<span class="arrow ${OPEN?'open':''}" title="${OPEN?'collapse':'expand'}">▶</span>
    <span class="t">${m.name}</span>` + (m.busy ? '<span class="spin"></span>' : '');
  /* the arrow expands; the label selects. Two different things. */
  row.querySelector('.arrow').onclick = e => { e.stopPropagation(); OPEN = !OPEN; render(); };
  row.onclick = () => { ROOM = 'main'; render(); };
  row.oncontextmenu = e => menuFor(e, 'main');
  box.appendChild(row);

  if (!OPEN) return;
  const kids = document.createElement('div'); kids.className = 'sub';

  if (subs().length){
    const h = document.createElement('div'); h.className = 'grp'; h.textContent = 'Rooms';
    kids.appendChild(h);
    subs().forEach(r => {
      const el = document.createElement('div');
      el.className = 'room' + (r.key === ROOM ? ' on' : '');
      el.innerHTML = `<span class="t">${r.name}</span>` + (r.busy ? '<span class="spin"></span>' : '')
        + `<span class="avs">${r.seats.map(id => { const mem = memberOf(seatById(id));
             return mem ? `<i style="background:${mem.color}"></i>` : ''; }).join('')}</span>`;
      el.onclick = e => { e.stopPropagation(); ROOM = r.key; render(); };
      el.oncontextmenu = e => menuFor(e, r.key);
      kids.appendChild(el);
    });
  }

  const h2 = document.createElement('div'); h2.className = 'grp'; h2.textContent = 'Seats';
  kids.appendChild(h2);
  S.seats.forEach(seat => {
    const mem = memberOf(seat);
    const el = document.createElement('div');
    el.className = 'seat' + (mem ? '' : ' free');
    el.innerHTML = `<span class="role">${seat.role}</span>`
      + (seat.lead ? '<span class="star" title="lead">★</span>' : '')
      + (mem ? `<span class="who"><span class="sw" style="background:${mem.color}">${mem.initial}</span>${mem.name}</span>`
             : '<span class="who">empty</span>');
    kids.appendChild(el);
  });

  box.appendChild(kids);
}

/* ------------------------------------------------------------------ header */
function renderTitle(){
  const r = room(), t = document.getElementById('title');
  t.innerHTML = `<span class="proj">kenbet</span><span class="dot">/</span>`
    + `<span class="sess">${mainRm().name}</span>`
    + (r.key === 'main' ? '' : `<span class="dot">/</span><span class="sub">${r.name}</span>`);
}

/* ------------------------------------------------------------------ seats */
function renderStrip(){
  const r = room(), st = document.getElementById('strip'); st.innerHTML = '';
  r.seats.forEach(id => {
    const seat = seatById(id), mem = memberOf(seat);
    const a = mem ? liveOf(mem.name) : {};
    const el = document.createElement('span');
    el.className = 'pers' + (seat.lead ? ' is-lead' : '') + (mem ? '' : ' free')
                 + (a.activity ? ' busy' : '');
    el.title = mem
      ? (mem.kind === 'human' ? 'you — lead of every room'
         : `${a.provider || mem.model} · ${a.model || ''}\nconversation ${a.conversation || '—'}`
           + `\n${a.turns || 0} turns · ${a.tokens || 0} tokens`)
      : 'no one is in this seat';
    el.innerHTML = `<span class="sw" style="background:${mem ? mem.color : ''}">${mem ? mem.initial : '·'}</span>`
      + `<span>${mem ? mem.name : 'empty'}</span><span class="role">${seat.role}</span>`
      + (seat.lead ? ' <span class="star">★</span>' : '')
      + (a.activity ? ` <span class="act">${a.activity}…</span>` : '');
    st.appendChild(el);
  });
  const sp = document.createElement('div'); sp.className = 'grow'; st.appendChild(sp);
  const mg = document.createElement('button'); mg.className = 'chip'; mg.textContent = 'Manage team…';
  mg.onclick = manageTeam; st.appendChild(mg);
}

/* ------------------------------------------------------------------ thread */
function renderThread(){
  const r = room(), th = document.getElementById('thread');
  const atBottom = th.scrollTop + th.clientHeight >= th.scrollHeight - 40;
  if (!r.messages.length){
    th.innerHTML = '<div class="empty">Empty room.<br>'
      + 'Write something — @Claude or @Codex for one of them, nothing for both.</div>';
    return;
  }
  th.innerHTML = r.messages.map(m => {
    if (m.author === 'system')
      return m.kind === 'error'
        ? `<div class="err">${esc(m.text)}</div>`
        : `<div class="sys"><span>${esc(m.text)}</span></div>`;
    const a = S.members[m.author] || {name:m.author, initial:'?', color:'#3b404d', model:''};
    const meta = m.meta || {};
    const tags = `<span class="tag">${esc(a.model)}</span>`
      + (meta.elapsed !== undefined ? `<span class="tag">${meta.elapsed}s</span>` : '')
      + (meta.tokens ? `<span class="tag">${meta.tokens} tok</span>` : '')
      + (m.author === 'you' ? '<span class="lb">★ lead</span>' : '');
    return `<div class="msg"><div class="av" style="background:${a.color}">${a.initial}</div><div>
      <div class="who"><b>${esc(a.name)}</b>${tags}<span class="time">${hhmm(m.ts)}</span></div>
      <div class="bd">${fmt(m.text)}</div></div></div>`;
  }).join('');
  if (atBottom) th.scrollTop = th.scrollHeight;
}

/* ------------------------------------------------------------------ status */
function renderStatus(){
  const s = S.status, bar = document.getElementById('statusbar');
  const procs = new Set();
  (s.agents || []).forEach(a => (a.pids || []).forEach(p => procs.add(p)));
  (s.shared || []).forEach(x => procs.add(x.pid));
  const turns = (s.agents || []).reduce((n,a) => n + (a.turns || 0), 0);
  const toks  = (s.agents || []).reduce((n,a) => n + (a.tokens || 0), 0);
  const backend = s.backend === 'app' ? 'codex app-server (experimental)' : 'codex mcp-server';
  const free = S.seats.filter(x => !x.occupant).length;
  bar.innerHTML =
     `<b>${backend}</b><span class="sep">|</span>`
    +`<b>${S.seats.length - free}</b>/${S.seats.length} seats filled<span class="sep">·</span>`
    +`<b>${s.agents.length}</b> conversations<span class="sep">·</span>`
    +`<b>${procs.size}</b> processes<span class="sep">·</span>`
    +`<b>${s.total_rss_mb}</b> MB<span class="sep">·</span>`
    +`<b>${turns}</b> turns<span class="sep">·</span><b>${toks.toLocaleString()}</b> tokens`;
}

function render(){ renderTree(); renderTitle(); renderStrip(); renderThread(); renderStatus();
  document.getElementById('sendbtn').disabled = room().busy; }

/* ------------------------------------------------------------------ menus */
function closeMenu(){ document.querySelectorAll('.ctx').forEach(m => m.remove()); }
document.addEventListener('click', closeMenu);
document.addEventListener('keydown', e => { if (e.key === 'Escape'){ closeMenu(); closeModal(); } });

function menuFor(ev, key){
  ev.preventDefault(); ev.stopPropagation(); closeMenu();
  const isMain = key === 'main';
  const r = S.rooms.find(x => x.key === key);
  const menu = document.createElement('div'); menu.className = 'ctx';
  const items = [];
  if (isMain) items.push(['⤿','Compact…', () => dlgCompact()]);
  items.push(['↺','Reconstruct…', () => dlgReconstruct(r)]);
  items.push(['—']);
  items.push(['◉','Manage team…', () => manageTeam()]);

  menu.innerHTML = `<div class="hdr">${isMain ? 'session · ' + r.name : 'room · ' + r.name}</div>`;
  items.forEach(it => {
    if (it[0] === '—'){ const d = document.createElement('div'); d.className = 'rule';
      menu.appendChild(d); return; }
    const b = document.createElement('button');
    b.innerHTML = `<i>${it[0]}</i>${it[1]}`;
    b.onclick = e => { e.stopPropagation(); closeMenu(); it[2](); };
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const w = menu.offsetWidth, h = menu.offsetHeight;
  menu.style.left = Math.min(ev.clientX, innerWidth  - w - 8) + 'px';
  menu.style.top  = Math.min(ev.clientY, innerHeight - h - 8) + 'px';
  return false;
}

/* ------------------------------------------------------------------ dialogs
   Nothing below is wired to an action yet — what compact and reconstruct
   should actually do is still being decided. Confirm closes and says so. */
function closeModal(){ document.querySelectorAll('.scrim').forEach(s => s.remove()); }

function modal(html, onOk, okLabel, danger){
  closeModal();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal">${html}
    <div class="foot"><button class="btn" data-x>Cancel</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${okLabel || 'Confirm'}</button></div></div>`;
  document.body.appendChild(scrim);
  scrim.onclick = e => { if (e.target === scrim) closeModal(); };
  scrim.querySelector('[data-x]').onclick = closeModal;
  scrim.querySelector('[data-ok]').onclick = () => { closeModal(); onOk && onOk(); };
  return scrim;
}

function dlgCompact(){
  const agents = S.seats.filter(s => s.occupant && S.members[s.occupant].kind === 'agent');
  modal(`<h3>Compact the session</h3>
    <div class="lead">Every agent replaces what it remembers with a summary of it,
      and carries on from there. The transcript is untouched: a marker is drawn
      where the fold happened, history above it, continued context below.</div>
    <div class="pending">Affects ${agents.length} agents:
      ${agents.map(s => S.members[s.occupant].name + ' (' + s.role + ')').join(', ')}.
      Each keeps its own summary — they hold different rooms, so they fold
      different things.</div>
    <div class="note">Not wired yet. Who writes the summary — the agent itself,
      or you, editing it before it is applied — is still open.</div>`,
    () => toast('Compact is not wired to anything yet'), 'Compact');
}

function dlgReconstruct(r){
  const inRoom = r.seats.map(seatById)
    .filter(s => s.occupant && S.members[s.occupant].kind === 'agent');
  modal(`<h3>Reconstruct ${r.key === 'main' ? 'the session' : '“' + r.name + '”'}</h3>
    <div class="lead">Close each agent's conversation and build it again from the
      room transcript — from what was actually said, not from what the agent
      concluded. Use it when an agent has gone off on a wrong understanding.</div>
    <div class="pending">Affects ${inRoom.length} agents:
      ${inRoom.map(s => S.members[s.occupant].name).join(', ') || '—'}.
      ${r.key === 'main' ? 'Main and every subroom.' : 'This room only.'}
      Nothing is deleted — the transcript is the record and it stays.</div>
    <div class="note">Not wired yet. Where the replay starts, and what happens
      when the wrong conclusion is itself in the transcript, is still open.</div>`,
    () => toast('Reconstruct is not wired to anything yet'), 'Reconstruct');
}

function manageTeam(){
  const people = Object.entries(S.members);
  const rows = S.seats.map(seat => `
    <div class="seatrow">
      <span class="role">${seat.role}</span>
      <select data-seat="${seat.id}">
        <option value="">— empty —</option>
        ${people.map(([k,m]) => `<option value="${k}" ${seat.occupant===k?'selected':''}>${m.name}</option>`).join('')}
      </select>
      <span class="star" title="lead">${seat.lead ? '★' : ''}</span>
    </div>`).join('');
  modal(`<h3>Manage team</h3>
    <div class="lead">Seats belong to the session. A seat is a role; who fills it
      can change without the seat losing its place.</div>
    <div class="seatlist">${rows}</div>
    <div class="note">Not wired yet. Adding a seat, and moving the lead star to
      someone else, come with the same change.</div>`,
    () => toast('Manage team is not wired to anything yet'), 'Save');
}

/* ------------------------------------------------------------------ io */
async function refresh(){
  const res = await fetch('/api/state'); S = await res.json(); render();
  const busy = S.rooms.some(r => r.busy);
  clearTimeout(POLL); POLL = setTimeout(refresh, busy ? 700 : 2500);
}

async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})});
  return r.json();
}

async function send(){
  const inp = document.getElementById('input'), text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '38px';
  document.getElementById('sendbtn').disabled = true;
  const d = await post('/api/send', {room: ROOM, text});
  if (d.error) toast(d.error);
  refresh();
}

document.getElementById('sendbtn').onclick = send;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
document.getElementById('input').addEventListener('input', e => {
  e.target.style.height = '38px';
  e.target.style.height = Math.min(180, e.target.scrollHeight) + 'px'; });
['members','runs','settings'].forEach(k =>
  document.getElementById('nav-'+k).onclick = () => toast(k + ' — not in this build'));

let TT; function toast(t){ clearTimeout(TT);
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); TT = setTimeout(() => d.remove(), 3000); }

refresh().then(() => document.getElementById('input').focus());
</script>
</body>
</html>
