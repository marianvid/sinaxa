<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sinaxa</title>
<link rel="stylesheet" href="/sinaxa.css">
</head>
<body>
<div class="app">

  <aside class="side">
    <div class="brand"><span class="mark">sinaxa</span></div>
    <div class="hd">Projects <u title="New project">+</u></div>
    <div class="scroll">
      <div class="node"><span class="t">sinaxa</span><span class="toggle" title="New session">+</span></div>
      <div class="sessions" id="tree"></div>
    </div>
    <nav class="nav">
      <div class="nb on"><i>▤</i>Projects</div>
      <div class="nb" id="nav-members"><i>◉</i>Members</div>
      <div class="nb" id="nav-runs"><i>⚡</i>Runs</div>
      <div class="nb" id="nav-settings"><i>⚙</i>Settings</div>
    </nav>
  </aside>

  <section class="main">
    <header class="top">
      <div class="title" id="title"></div>
      <div class="seatbar" id="seatbar"></div>
      <div class="grow"></div>
      <button class="chip" id="managebtn">Manage team…</button>
    </header>
    <div class="thread" id="thread"></div>
    <div class="composer">
      <div class="cbox">
        <textarea id="input" placeholder="Message the room…   @Claude or @Codex to address one"></textarea>
        <div class="ctools"><div class="grow"></div><button class="send" id="sendbtn">Send</button></div>
      </div>
    </div>
  </section>

  <div class="statusbar" id="statusbar"></div>
</div>

<script>
/* ------------------------------------------------------------------ state */
let S = null;              /* last /api/state payload */
let ROOM = 'main';         /* selected room key */
let OPEN = true;           /* is the session expanded in the sidebar */
let SEL = new Set();       /* seat ids picked with cmd/ctrl-click */
let POLL = null;

const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const fmt = s => esc(s)
  .replace(/```([\s\S]*?)```/g,(m,c)=>'<pre>'+c.replace(/^\n/,'')+'</pre>')
  .replace(/`([^`\n]+)`/g,'<code>$1</code>')
  .replace(/@(Claude|Codex|Marian)\b/g,'<span class="mention">@$1</span>');
const hhmm = ts => { const d=new Date(ts*1000);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); };

const room    = () => S.rooms.find(r => r.key === ROOM) || S.rooms[0];
const mainRm  = () => S.rooms.find(r => r.key === 'main');
const subs    = () => S.rooms.filter(r => r.kind === 'group');
const seatById= id => S.seats.find(s => s.id === id);
const memberOf= seat => seat.occupant ? S.members[seat.occupant] : null;
const liveOf  = name => (S.status.agents || [])
  .filter(a => a.member === name && (a.scope === ROOM || a.scope === '*'))[0] || {};

/* ------------------------------------------------------------------ sidebar */
function renderTree(){
  const box = document.getElementById('tree'); box.innerHTML = '';
  const m = mainRm();

  const row = document.createElement('div');
  row.className = 'sess' + (ROOM === 'main' ? ' on' : '');
  row.innerHTML = `<span class="arrow ${OPEN ? 'open' : ''}" title="${OPEN ? 'collapse' : 'expand'}">\u25b6</span>
    <span class="t">${m.name}</span>` + (m.busy ? '<span class="spin"></span>' : '');
  /* the arrow expands, the label selects — two different things */
  row.querySelector('.arrow').onclick = e => { e.stopPropagation(); OPEN = !OPEN; render(); };
  row.onclick = () => { ROOM = 'main'; render(); };
  box.appendChild(row);

  if (!OPEN) return;
  const kids = document.createElement('div'); kids.className = 'sub';

  /* One entry per seat. A plain click selects it and opens its room;
     cmd/ctrl-click adds a second seat to the selection; right-clicking the
     selection offers to make a room out of it. */
  S.seats.forEach(seat => {
    const mem = memberOf(seat);
    const el = document.createElement('div');
    el.className = 'room' + (seat.room && seat.room === ROOM ? ' on' : '')
                 + (SEL.has(seat.id) ? ' sel' : '') + (mem ? '' : ' free');
    el.innerHTML = `<span class="t">${seat.role}</span>`
      + (mem ? `<span class="sw" style="background:${mem.color}">${mem.initial}</span>` : '');

    el.onclick = e => {
      e.stopPropagation();
      if (!mem) return toast('that seat is empty — assign someone in Manage team');
      if (e.metaKey || e.ctrlKey){
        SEL.has(seat.id) ? SEL.delete(seat.id) : SEL.add(seat.id);
        return render();
      }
      SEL = new Set([seat.id]);
      if (seat.room) ROOM = seat.room;
      render();
    };

    el.oncontextmenu = e => {
      if (!mem) return;
      if (!SEL.has(seat.id)) SEL = new Set([seat.id]);
      render();
      seatMenu(e);
    };

    kids.appendChild(el);
  });

  /* Rooms you define yourself: the lead plus a chosen few. */
  subs().forEach(r => {
    const el = document.createElement('div');
    el.className = 'room' + (r.key === ROOM ? ' on' : '');
    el.innerHTML = `<span class="t"># ${r.name}</span>` + (r.busy ? '<span class="spin"></span>' : '');
    el.onclick = e => { e.stopPropagation(); ROOM = r.key; render(); };
    kids.appendChild(el);
  });

  box.appendChild(kids);
}

/* --------------------------------------------------------------- header
   Everything about who is in the team lives here: the breadcrumb, then one
   pill per seat. A seat is the way into its occupant's room. */
function renderHead(){
  const r = room(), t = document.getElementById('title');
  t.innerHTML = `<span class="proj">sinaxa</span><span class="dot">/</span>`
    + `<span class="sess" data-go="main">${mainRm().name}</span>`;
  t.querySelector('[data-go]').onclick = () => { ROOM = 'main'; render(); };

  const st = document.getElementById('seatbar'); st.innerHTML = '';
  S.seats.forEach(seat => {
    const mem = memberOf(seat);
    const a = mem ? liveOf(mem.name) : {};
    const el = document.createElement('span');
    el.className = 'pers' + (seat.lead ? ' is-lead' : '') + (mem ? '' : ' free')
                 + (a.activity ? ' busy' : '')
                 + (seat.room && seat.room === ROOM ? ' on' : '');
    el.title = !mem ? 'no one is in this seat'
      : (mem.kind === 'human' ? 'your notes \u2014 nothing written here reaches an agent'
         : `${a.provider || mem.model} \u00b7 ${a.model || ''}`
           + `\nconversation ${a.conversation || '\u2014'}`
           + `\n${a.turns || 0} turns \u00b7 ${a.tokens || 0} tokens`);
    el.innerHTML = `<span class="sw" style="background:${mem ? mem.color : ''}">${mem ? mem.initial : '\u00b7'}</span>`
      + `<span>${mem ? mem.name : 'empty'}</span><span class="role">${seat.role}</span>`
      + (seat.lead ? ' <span class="star">\u2605</span>' : '')
      + (a.activity ? ` <span class="act">${a.activity}\u2026</span>` : '');
    if (seat.room) el.onclick = () => { ROOM = seat.room; render(); };
    else el.onclick = () => toast('that seat is empty \u2014 assign someone in Manage team');
    st.appendChild(el);
  });
}

/* ------------------------------------------------------------------ thread */
function renderThread(){
  const r = room(), th = document.getElementById('thread');
  const atBottom = th.scrollTop + th.clientHeight >= th.scrollHeight - 40;
  if (!r.messages.length){
    th.innerHTML = r.kind === 'notes'
      ? '<div class="empty">Your notes.<br>Nothing written here reaches an agent.</div>'
      : '<div class="empty">Empty room.<br>'
        + 'Write something — @Claude or @Codex for one of them, nothing for both.</div>';
    return;
  }
  th.innerHTML = r.messages.map(m => {
    if (m.author === 'system')
      return m.kind === 'error'
        ? `<div class="err">${esc(m.text)}</div>`
        : `<div class="sys"><span>${esc(m.text)}</span></div>`;
    const a = S.members[m.author] || {name:m.author, initial:'?', color:'#3b404d', model:''};
    const meta = m.meta || {};
    const tags = `<span class="tag">${esc(a.model)}</span>`
      + (meta.elapsed !== undefined ? `<span class="tag">${meta.elapsed}s</span>` : '')
      + (meta.tokens ? `<span class="tag">${meta.tokens} tok</span>` : '')
      + (m.author === 'you' ? '<span class="lb">★ lead</span>' : '');
    return `<div class="msg"><div class="av" style="background:${a.color}">${a.initial}</div><div>
      <div class="who"><b>${esc(a.name)}</b>${tags}<span class="time">${hhmm(m.ts)}</span></div>
      <div class="bd">${fmt(m.text)}</div></div></div>`;
  }).join('');
  if (atBottom) th.scrollTop = th.scrollHeight;
}

/* ------------------------------------------------------------------ status */
function renderStatus(){
  const s = S.status, bar = document.getElementById('statusbar');
  const procs = new Set();
  (s.agents || []).forEach(a => (a.pids || []).forEach(p => procs.add(p)));
  (s.shared || []).forEach(x => procs.add(x.pid));
  const turns = (s.agents || []).reduce((n,a) => n + (a.turns || 0), 0);
  const toks  = (s.agents || []).reduce((n,a) => n + (a.tokens || 0), 0);
  const backend = s.backend === 'app' ? 'codex app-server (experimental)' : 'codex mcp-server';
  const free = S.seats.filter(x => !x.occupant).length;
  bar.innerHTML =
     `<b>${backend}</b><span class="sep">|</span>`
    +`<b>${S.seats.length - free}</b>/${S.seats.length} seats filled<span class="sep">·</span>`
    +`<b>${s.agents.length}</b> conversations<span class="sep">·</span>`
    +`<b>${procs.size}</b> processes<span class="sep">·</span>`
    +`<b>${s.total_rss_mb}</b> MB<span class="sep">·</span>`
    +`<b>${turns}</b> turns<span class="sep">·</span><b>${toks.toLocaleString()}</b> tokens`;
}

function render(){ renderTree(); renderHead(); renderThread(); renderStatus();
  const r = room();
  document.getElementById('sendbtn').disabled = r.busy;
  document.getElementById('input').placeholder =
      r.kind === 'notes'  ? 'A note to yourself…   nobody is woken'
    : r.kind === 'direct' ? 'Message ' + (S.members[r.members[1]] || {name:r.name}).name + '…'
    : 'Message the room…   @Claude or @Codex to address one'; }

/* --------------------------------------------------------------- selection
   A room is the lead plus the agents you picked, so it takes at least two
   seats to be worth making — one is the direct room you already have. */
function closeMenu(){ document.querySelectorAll('.ctx').forEach(m => m.remove()); }
document.addEventListener('click', closeMenu);

function seatMenu(ev){
  ev.preventDefault(); ev.stopPropagation(); closeMenu();
  const picked = [...SEL].map(id => S.seats.find(x => x.id === id)).filter(Boolean);
  const names  = picked.map(x => (memberOf(x) || {}).name).filter(Boolean);
  const enough = picked.length >= 2;

  const menu = document.createElement('div'); menu.className = 'ctx';
  menu.innerHTML = `<div class="hdr">${names.join(' · ') || 'nothing selected'}</div>`;
  const b = document.createElement('button');
  b.innerHTML = `<i>▤</i>Create a room`;
  if (!enough){ b.disabled = true; b.title = 'pick a second seat with cmd-click'; }
  b.onclick = e => { e.stopPropagation(); closeMenu();
    toast('Create a room — not wired yet (' + names.join(', ') + ')'); };
  menu.appendChild(b);
  if (!enough){
    const h = document.createElement('div'); h.className = 'hint2';
    h.textContent = 'cmd-click a second seat';
    menu.appendChild(h);
  }
  document.body.appendChild(menu);
  menu.style.left = Math.min(ev.clientX, innerWidth  - menu.offsetWidth  - 8) + 'px';
  menu.style.top  = Math.min(ev.clientY, innerHeight - menu.offsetHeight - 8) + 'px';
  return false;
}

/* ------------------------------------------------------------------ dialogs
   Nothing below is wired to an action yet — what compact and reconstruct
   should actually do is still being decided. Confirm closes and says so. */
function closeModal(){ document.querySelectorAll('.scrim').forEach(s => s.remove()); }

function modal(html, onOk, okLabel, danger){
  closeModal();
  const scrim = document.createElement('div'); scrim.className = 'scrim';
  scrim.innerHTML = `<div class="modal">${html}
    <div class="foot"><button class="btn" data-x>Cancel</button>
      <button class="btn ${danger ? 'danger' : 'primary'}" data-ok>${okLabel || 'Confirm'}</button></div></div>`;
  document.body.appendChild(scrim);
  scrim.onclick = e => { if (e.target === scrim) closeModal(); };
  scrim.querySelector('[data-x]').onclick = closeModal;
  scrim.querySelector('[data-ok]').onclick = () => { closeModal(); onOk && onOk(); };
  return scrim;
}

function manageTeam(){
  /* Edits stay in this local copy: nothing is wired to the server yet. */
  const draft = S.seats.map(x => ({...x}));
  const people = Object.entries(S.members);

  const rowHtml = (seat, i) => `
    <div class="seatrow" data-i="${i}">
      <select class="rolesel" data-i="${i}">
        ${ROLES.concat(ROLES.includes(seat.role) ? [] : [seat.role])
             .map(r => `<option ${r === seat.role ? 'selected' : ''}>${r}</option>`).join('')}
      </select>
      <select class="whosel" data-i="${i}">
        <option value="">— empty —</option>
        ${people.map(([k, m]) =>
          `<option value="${k}" ${seat.occupant === k ? 'selected' : ''}>${m.name}</option>`).join('')}
      </select>
      <span class="star" title="${seat.lead ? 'lead' : 'make lead'}"
            data-lead="${i}">${seat.lead ? '★' : '☆'}</span>
      <button class="x" data-del="${i}" title="remove this role">✕</button>
    </div>`;

  const scrim = modal(`<h3>Manage team</h3>
    <div class="lead">Seats belong to the session. A seat is a role; who fills it
      can change without the seat losing its place in the rooms.</div>
    <div class="seatlist"></div>
    <div class="addrole">+ Add role</div>
    <div class="note">Not wired yet — nothing here reaches the agents. Removing a
      role would also decide what happens to its conversation, and that is still
      open.</div>`,
    () => toast('Manage team is not wired to anything yet'), 'Save');

  const list = scrim.querySelector('.seatlist');

  function draw(){
    list.innerHTML = draft.map(rowHtml).join('');
    list.querySelectorAll('.rolesel').forEach(el =>
      el.onchange = () => { draft[+el.dataset.i].role = el.value; });
    list.querySelectorAll('.whosel').forEach(el =>
      el.onchange = () => { draft[+el.dataset.i].occupant = el.value || null; });
    list.querySelectorAll('[data-lead]').forEach(el =>
      el.onclick = () => { const i = +el.dataset.lead;
        draft.forEach((d, k) => d.lead = (k === i)); draw(); });
    list.querySelectorAll('[data-del]').forEach(el =>
      el.onclick = () => { draft.splice(+el.dataset.del, 1);
        if (draft.length && !draft.some(d => d.lead)) draft[0].lead = true;
        draw(); });
  }

  scrim.querySelector('.addrole').onclick = () => {
    const free = ROLES.find(r => !draft.some(d => d.role === r)) || "role";
    draft.push({id: 'new' + draft.length, role: free, occupant: null, lead: false});
    draw();
  };

  draw();
}

/* ------------------------------------------------------------------ io */
async function refresh(){
  const res = await fetch('/api/state'); S = await res.json(); render();
  const busy = S.rooms.some(r => r.busy);
  clearTimeout(POLL); POLL = setTimeout(refresh, busy ? 700 : 2500);
}

async function post(path, body){
  const r = await fetch(path, {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify(body || {})});
  return r.json();
}

async function send(){
  const inp = document.getElementById('input'), text = inp.value.trim();
  if (!text) return;
  inp.value = ''; inp.style.height = '38px';
  document.getElementById('sendbtn').disabled = true;
  const d = await post('/api/send', {room: ROOM, text});
  if (d.error) toast(d.error);
  refresh();
}

document.getElementById('managebtn').onclick = manageTeam;
document.getElementById('sendbtn').onclick = send;
document.getElementById('input').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); send(); }});
document.getElementById('input').addEventListener('input', e => {
  e.target.style.height = '38px';
  e.target.style.height = Math.min(180, e.target.scrollHeight) + 'px'; });
['members','runs','settings'].forEach(k =>
  document.getElementById('nav-'+k).onclick = () => toast(k + ' — not in this build'));

let TT; function toast(t){ clearTimeout(TT);
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const d = document.createElement('div'); d.className = 'toast'; d.textContent = t;
  document.body.appendChild(d); TT = setTimeout(() => d.remove(), 3000); }

refresh().then(() => document.getElementById('input').focus());
</script>
</body>
</html>
