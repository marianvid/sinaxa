<!doctype html><html lang="en" data-theme="dark"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Projects · Sinaxa</title><link rel="stylesheet" href="/projects.css"></head><body>
<div class="app">
 <aside><div class="brand">sinaxa</div><div class="section-title">Projects <button id="newProject">+</button></div>
  <div id="projects" class="projects"></div>
  <nav><a class="active" href="/projects.html">Projects</a><a href="/members.html">Members</a><a href="/engines.html">Engines</a><a href="/settings.html">Settings</a></nav>
 </aside>
 <section class="workspace">
  <header><div><div class="eyebrow" id="projectState"></div><h1 id="projectTitle">Projects</h1></div>
   <div class="actions"><button id="toggleProject">Close project</button><button class="primary" id="newSession">+ Session</button></div></header>
  <div class="layout">
   <section class="rail"><div class="rail-title">Seats <button id="newSeat">+</button></div><div id="seats"></div>
    <div class="rail-title spaced">Sessions <button id="newSessionSmall">+</button></div><div id="sessions"></div></section>
   <main class="conversation"><div class="conversation-head"><div><h2 id="sessionTitle">Select a project</h2><div id="participants"></div></div>
    <div class="conversation-actions"><button id="clearContext">Clear context</button><button id="sessionMenu">•••</button></div></div>
    <div class="search"><input id="search" placeholder="Search this session"></div>
    <div id="messages" class="messages"></div>
    <div id="composer" class="composer"><div id="attachments"></div><textarea id="message" placeholder="Write a message…"></textarea>
     <div class="composer-tools"><span><button data-format="**">B</button><button data-format="_">I</button><button id="attach">📎</button><input id="files" type="file" accept="image/*" multiple hidden></span><button class="send" id="send">Send</button></div></div>
   </main>
  </div>
 </section>
</div>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><p class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="dialogSave" value="default">Save</button></p></form></dialog>
<script src="/projects.js"></script></body></html>
