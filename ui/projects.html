<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects · sinaxa</title><link rel="stylesheet" href="/projects.css">
</head>
<body><div class="app">
  <header class="global-header">
    <div class="brand"><span class="mark">sinaxa</span></div>
    <nav class="global-nav" aria-label="Sections">
      <a class="nb on" href="/projects.html"><i aria-hidden="true">▤</i><span>Chats</span></a>
      <a class="nb" href="/members.html"><i aria-hidden="true">◉</i><span>Agents</span></a>
      <a class="nb" href="/seats.html"><i aria-hidden="true">▦</i><span>Seats</span></a>
      <a class="nb" href="/types.html"><i aria-hidden="true">◇</i><span>Types</span></a>
      <a class="nb" href="/engines.html"><i aria-hidden="true">⌘</i><span>Engines</span></a>
    </nav>
    <div class="global-actions">
      <a class="global-action" href="/settings.html"><i aria-hidden="true">⚙</i><span>Settings</span></a>
      <span class="global-divider" aria-hidden="true"></span>
      <button class="global-action" id="themeToggle" type="button"></button>
    </div>
  </header>
  <aside class="side">
    <div class="hd">Projects <u id="newProject" title="New project">+</u></div>
    <div class="scroll">
      <div id="projects" class="projects"></div>
    </div>
  </aside>
  <section class="main">
    <div hidden aria-hidden="true">
      <div class="title"><span class="proj" id="projectTitle">Projects</span><span class="dot">/</span><span class="sess" id="sessionTitle">Select a project</span><span class="sub" id="projectState"></span></div>
      <div class="seatbar" id="participants"></div>
      <button class="chip" id="clearContext">Clear context</button>
      <button class="chip icon" id="sessionMenu" aria-label="Session options">•••</button>
      <button id="newSessionSmall" type="button">New session</button>
    </div>
    <section id="projectOverview" class="project-overview" hidden>
      <header class="overview-header">
        <div><span class="overview-kicker">Project</span><h1 id="overviewTitle"></h1><p id="overviewMeta"></p></div>
        <div class="overview-actions"><button class="chip" id="toggleProject">Close project</button><button class="chip primary" id="newSession">+ Session</button></div>
      </header>
      <section class="overview-section">
        <div class="overview-section-title"><div><h2>Main team</h2><p>Seats active in the project and the members occupying them.</p></div><button class="btn" id="openMain">Open Main</button></div>
        <div id="seats" class="overview-seats"></div>
        <button id="newSeat" class="add-seat" type="button">+ Add seat from catalog</button>
      </section>
      <section class="overview-section custom-sessions"><div class="overview-section-title"><div><h2>Custom sessions</h2><p>Focused conversations with a selected group of seats.</p></div></div><div id="sessions" class="overview-sessions"></div></section>
    </section>
    <section id="conversationView" class="conversation-view" hidden>
      <div class="searchbar"><span>⌕</span><input id="search" placeholder="Search this session"><span class="search-divider" aria-hidden="true"></span><button id="clearSession" class="search-action" type="button" title="Clear session" aria-label="Clear session"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path></svg><span>Clear session</span></button></div>
      <div id="messages" class="thread"></div>
      <div id="composer" class="composer"><div class="cbox">
        <div id="attachments" class="pasted"></div>
        <textarea id="message" placeholder="Write a message…"></textarea>
        <div class="ctools"><button class="tool" data-format="**" title="Bold">B</button><button class="tool italic" data-format="_" title="Italic">I</button><button class="tool" id="attach" title="Attach image">⌕</button><input id="files" type="file" accept="image/*" multiple hidden><div class="grow"></div><button class="send" id="send">Send</button></div>
      </div></div>
    </section>
  </section>
</div>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><p class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="dialogSave" value="default">Save</button></p></form></dialog>
<dialog id="confirmDialog" class="confirm-dialog" aria-labelledby="confirmTitle" aria-describedby="confirmMessage confirmNote">
  <form method="dialog">
    <div class="confirm-heading">
      <span class="confirm-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 11v5M14 11v5"></path></svg></span>
      <div><h2 id="confirmTitle"></h2><p id="confirmMessage"></p></div>
    </div>
    <p id="confirmNote" class="confirm-note"></p>
    <p class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button class="danger-action" id="confirmAccept" value="confirm">Clear session</button></p>
  </form>
</dialog>
<script src="/base.js"></script><script src="/projects.js"></script></body></html>
