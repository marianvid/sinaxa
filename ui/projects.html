<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Projects · sinaxa</title><link rel="stylesheet" href="/projects.css">
</head>
<body><div class="app">
  <header class="global-header">
    <div class="brand"><span class="mark">sinaxa</span></div>
    <nav class="global-nav" aria-label="Sections">
      <a class="nb on" href="/projects.html"><i aria-hidden="true">▤</i><span>Chats</span></a>
      <a class="nb" href="/members.html"><i aria-hidden="true">◉</i><span>Agents</span></a>
      <a class="nb" href="/seats.html"><i aria-hidden="true">▦</i><span>Seats</span></a>
      <a class="nb" href="/types.html"><i aria-hidden="true">◇</i><span>Types</span></a>
      <a class="nb" href="/engines.html"><i aria-hidden="true">⌘</i><span>Engines</span></a>
    </nav>
    <div class="global-actions">
      <a class="global-action" href="/settings.html"><i aria-hidden="true">⚙</i><span>Settings</span></a>
      <span class="global-divider" aria-hidden="true"></span>
      <button class="global-action" id="themeToggle" type="button"></button>
    </div>
  </header>
  <aside class="side">
    <div class="hd">Projects <u id="newProject" title="New project">+</u></div>
    <div class="scroll">
      <div id="projects" class="projects"></div>
    </div>
  </aside>
  <section class="main">
    <div hidden>
      <div class="title"><span class="proj" id="projectTitle">Projects</span><span class="dot">/</span><span class="sess" id="sessionTitle">Select a project</span><span class="sub" id="projectState"></span></div>
      <div class="seatbar" id="participants"></div>
      <button class="chip" id="toggleProject">Close project</button>
      <button class="chip primary" id="newSession">+ Session</button>
      <button class="chip" id="clearContext">Clear context</button>
      <button class="chip icon" id="sessionMenu" aria-label="Session options">•••</button>
      <button id="newSeat" type="button">Add seat</button>
      <button id="newSessionSmall" type="button">New session</button>
      <div id="seats"></div><div id="sessions"></div>
    </div>
    <div class="searchbar"><span>⌕</span><input id="search" placeholder="Search this session"></div>
    <div id="messages" class="thread"></div>
    <div id="composer" class="composer"><div class="cbox">
      <div id="attachments" class="pasted"></div>
      <textarea id="message" placeholder="Write a message…"></textarea>
      <div class="ctools"><button class="tool" data-format="**" title="Bold">B</button><button class="tool italic" data-format="_" title="Italic">I</button><button class="tool" id="attach" title="Attach image">⌕</button><input id="files" type="file" accept="image/*" multiple hidden><div class="grow"></div><button class="send" id="send">Send</button></div>
    </div></div>
  </section>
</div>
<dialog id="dialog"><form method="dialog"><h2 id="dialogTitle"></h2><div id="dialogBody"></div><p class="dialog-actions"><button value="cancel" formnovalidate>Cancel</button><button class="primary" id="dialogSave" value="default">Save</button></p></form></dialog>
<script src="/base.js"></script><script src="/projects.js"></script></body></html>
